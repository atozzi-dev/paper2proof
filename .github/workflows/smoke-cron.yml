# Daily canary smoke on the live demo during judging (architecture §13.2), 2026-10-30 to
# 2026-12-15 at 07:00 UTC. A failure opens (or comments on) one issue.
# Environment `smoke`: main only, no reviewer (a scheduled run cannot wait for an approval). It
# holds only P2P_SMOKE_INVITE (a low-quota, expiring invite), never the admin token.
name: smoke-cron

on:
  schedule:
    - cron: "17 7 * * *" # off the hour: GitHub delays or drops fewer runs
  workflow_dispatch:
    inputs:
      force:
        description: Run even outside the judging window
        type: boolean
        default: false

permissions: {}

concurrency:
  group: smoke-cron
  cancel-in-progress: false

jobs:
  smoke:
    name: canary smoke on the live endpoint
    if: github.ref == 'refs/heads/main' # the smoke environment allows main only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: smoke
    permissions:
      actions: read # the endpoint URL artifact of the last successful deploy
      contents: read
    steps:
      - name: Check the judging window
        id: window
        env:
          FORCE: ${{ inputs.force }}
        run: |
          today=$(date -u +%F)
          if [ "$FORCE" = true ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [[ "$today" < "2026-10-30" || "$today" > "2026-12-15" ]]; then
            echo "outside the judging window (2026-10-30..2026-12-15): nothing to do"
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false

      # One retry after 5 minutes: a deploy restarting the endpoint must not open an issue.
      - name: Smoke test
        if: steps.window.outputs.active == 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          # no deploy.yml run records a URL in the hybrid deploy: the live service by default
          P2P_API_URL: ${{ vars.P2P_API_URL || 'https://paper2proof.com' }}
          P2P_SMOKE_INVITE: ${{ secrets.P2P_SMOKE_INVITE }}
        run: |
          set -o pipefail
          # A recreate may change the endpoint URL: prefer the one the last deploy recorded.
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name endpoint-url --dir "$RUNNER_TEMP/url"; then
            recorded=$(head -n 1 "$RUNNER_TEMP/url/endpoint-url.txt")
            if [[ "$recorded" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
              P2P_API_URL="$recorded"
            fi
          fi
          [[ "$P2P_API_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] \
            || { echo "::error::no valid https endpoint URL (deploy or set P2P_API_URL)"; exit 1; }
          echo "smoke target: $P2P_API_URL"
          smoke() {
            if [ -f deploy/smoke.sh ]; then
              bash deploy/smoke.sh "$P2P_API_URL"
            else  # until the canary script exists: the endpoint's own readiness check, every check true
              curl -fsS --proto =https --max-time 20 "${P2P_API_URL%/}/readyz" | jq -e '.checks | all' > /dev/null
            fi
          }
          if ! smoke; then
            echo "first attempt failed; retrying in 5 minutes"
            sleep 300
            smoke
          fi

  report:
    name: open or update the failure issue
    needs: smoke
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Daily smoke failed"
          body="The daily canary smoke failed on $(date -u +%F): $RUN_URL"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
