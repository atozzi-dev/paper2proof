# Runner image digests (p2p-runner and p2p-runner-cpu) built with the exec manifest's time
# target (A-46: min_seeds, target_seconds). Every new manifest carries it, and a runner from
# before A-46 refuses such a manifest (exit 30, which users would read as a failed experiment),
# so P2P_ENV=prod refuses to start with a runner digest that is not listed here.
# Add a digest when its image is built from A-47 or later (docs/DEPLOY.md, "When the runner
# changes"); never list one built before: an A-46 runner also refuses budget_seconds over
# 1800, the hour a GPU target may get (A-47).
time_target: []

# p2p-runner-cpu digests built from A-50 or later: their smoke runner extracts the smoke
# subset into its dataset's folder (the smoke manifest's smoke_folder). An older one puts it in
# data/smoke, where no script looks: the run-time echo check would stop every run after one
# smoke run, so P2P_ENV=prod refuses to start with a P2P_RUNNER_CPU_IMAGE not listed here.
# A digest listed here is listed in time_target too.
smoke_folder: []
