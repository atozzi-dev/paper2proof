# Enforced by app/orchestrator/budget.py before every model call and job submission.
per_run:
  tokens_in: 1500000
  tokens_out: 150000
  inference_usd: 1.00
  # Experiment minutes (A-47, GPU when needed): a run on the GPU has up to gpu_minutes, one on
  # CPU (Token Factory Sandboxes) up to cpu_minutes. A CPU plan cut to REDUCED, or estimated
  # over gpu_when_cpu_estimate_over of cpu_minutes, gets a GPU plan when the invite allows it;
  # a GPU job that is not running within gpu_wait_s falls back to the CPU plan.
  gpu_minutes: 30  # 60 once EXECUTING budgets each target (A-47, task 6)
  cpu_minutes: 30
  gpu_wait_s: 600
  gpu_when_cpu_estimate_over: 0.5
  fix_iterations: 8
  package_requests: 2
  tavily_credits: 20
  # Seeds: the plan lists up to max_seeds; after the minimum (verdict.yaml min_seeds) the
  # runner starts the next one only if it should end within seed_target_s of the job's start
  # (elapsed time only, never the measured values).
  max_seeds: 10
  seed_target_s: 600
global:
  concurrent_runs: 2
  cloud_usd_per_day: 15.00
  inference_usd_per_day: 6.00
  dev_inference_usd_per_day: 2.00     # P2P_ENV=dev
  tavily_credits_per_day: 200
approval:
  auto_approve_below_usd: 0.60        # estimated cloud + inference cost of the plan
  approval_timeout_min: 30
invites:
  default_quota_per_day: 3
