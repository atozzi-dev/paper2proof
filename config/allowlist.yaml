# Egress policy for the gateway (rendered into squid.conf by infra) and package policy.
# Derive the real HF/CDN hosts from gateway logs during spike S-5; do not rely on memory.
egress:
  provision:
    - .pypi.org
    - .pythonhosted.org
    - .huggingface.co
    - .hf.co
    - github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - download.pytorch.org
    - "${NEBIUS_STORAGE_HOST}"
    - "${NEBIUS_REGISTRY_HOST}"
  exec:
    - "${NEBIUS_STORAGE_HOST}"
    - "${NEBIUS_REGISTRY_HOST}"

packages:
  max_per_request: 5
  # Requests per run: budgets.yaml per_run.package_requests (single source of truth).
  min_releases: 5
  min_age_days: 180
  popular_list: config/pypi_top500.txt     # generated by task A-19
  # Packages never installable via request_packages (they would change the tooling itself).
  denylist:
    - pip
    - uv
    - setuptools
    - wheel
