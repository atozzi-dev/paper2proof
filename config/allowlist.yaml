# Egress policy for the gateway (rendered into squid.conf by infra) and package policy.
# Derive the real HF/CDN hosts from gateway logs during spike S-5; do not rely on memory.
egress:
  provision:
    - .pypi.org
    - .pythonhosted.org
    - .huggingface.co
    - .hf.co
    - github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - download.pytorch.org
    - "${NEBIUS_STORAGE_HOST}"
    - "${NEBIUS_REGISTRY_HOST}"
  exec:
    - "${NEBIUS_STORAGE_HOST}"
    - "${NEBIUS_REGISTRY_HOST}"

packages:
  max_per_request: 5
  # Requests per run: budgets.yaml per_run.package_requests (single source of truth).
  min_releases: 5
  min_age_days: 180
  popular_list: config/pypi_top500.txt     # generated by task A-19
  # A-51: on CPU, a request without a version for one of these is installed as its CPU build,
  # the same library under the same import name, without what a CPU run cannot use. A Token
  # Factory Sandbox has a small disk: InterpretML's overlay filled it (2026-10-30).
  cpu_substitutes:
    xgboost: xgboost-cpu        # without the GPU build and its NCCL dependency
    interpret: interpret-core   # without the dashboards and notebook extras
  # Packages never installable via request_packages (they would change the tooling itself).
  denylist:
    - pip
    - uv
    - setuptools
    - wheel
