# Verdict engine configuration (docs/specs/verdict-engine.md). Hashed into every verdict.
tol_rel: 0.02
default_tol_abs: 0.0
tol_abs:
  top1_accuracy: 0.005
  accuracy: 0.005
  f1: 0.005
  auc: 0.005
  bleu: 0.5
rho: 0.5
min_seeds: 3
confidence: 0.95
# An ABSOLUTE measured mean more than this many times off the paper's value (same sign, both
# non-zero) is INCONCLUSIVE/IMPLAUSIBLE_GAP, never NOT_REPRODUCED: broken training or a unit
# mismatch (count vs rate, fraction vs percent), not a wrong claim. .inf disables the rule.
implausible_ratio: 3.0
