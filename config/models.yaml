# Role -> model resolution. IDs are resolved at startup against GET /v1/models.
# Use `match` (case-insensitive substring, must hit exactly one model) or `exact_id`.
# Quote "on"/"off": unquoted, YAML 1.1 parsers turn them into booleans.
# Checked by spike S-2 on 2026-10-21 (docs/spikes/RESULTS.md).
provider:
  base_url: https://api.tokenfactory.nebius.com/v1/
  api_key_env: NEBIUS_API_KEY
  timeout_s: 120
  max_retries: 4
  # How reasoning on/off is sent: chat_template_kwargs | system_flag | none. Set from spike S-2.
  reasoning_toggle: chat_template_kwargs

# Token Factory retires Nemotron 3 Super and Nemotron 3 Nano on 2026-11-09 and recommends
# Nemotron 3.5 Super VL and Nemotron 3.5 Lightning in their place (same prices). As the Coder,
# Super VL never reached a smoke run on 4 of 5 set B papers (2026-10-30): the Coder runs on Ultra.
roles:
  reader:  { match: "nemotron-3.5-super-vl", max_output: 8000, temperature: 0.1, reasoning: "off" }
  coder:   { match: "nemotron-3-ultra",    max_output: 6000, temperature: 0.2, reasoning: "off", timeout_s: 300 }
  planner: { match: "nemotron-3-ultra",    max_output: 8000, temperature: 0.2, reasoning: "on", timeout_s: 300 }
  judge:   { match: "nemotron-3-ultra",    max_output: 3000, temperature: 0.0, reasoning: "on", timeout_s: 300 }
  vision:  { match: "nemotron-3.5-super-vl", max_output: 2000, temperature: 0.0, reasoning: "off" }  # S-2: no Nano Omni
  utility: { match: "nemotron-3_5-lightning", max_output: 1500, temperature: 0.0, reasoning: "off" }

fallbacks:
  planner: reader
  judge: reader
  coder: reader      # planner runs the same model as coder; fall back to a different one
  reader: null
  utility: null
  vision: null      # no text-only substitute: skip figure extraction and log a warning

structured_output:
  # "json_schema" if spike S-2 confirmed response_format support for the role's model, else "tool"
  reader: tool
  planner: tool
  judge: tool
  vision: tool
  utility: tool
