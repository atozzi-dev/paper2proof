[project]
name = "paper2proof"
version = "0.1.0"
description = "Extracts quantitative claims from arXiv ML papers, re-runs them in isolation on Nebius GPUs and returns a deterministic verdict with a signed Proof Bundle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0.2,<7",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.4",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "scipy-stubs>=1.14",
    "shellcheck-py>=0.10.0.1",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "docs"]  # spec snippets in docs/ are illustrative, not runnable

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: calls real Token Factory / Tavily / Nebius APIs and costs money (ask first)",
    "docker: needs a local Docker daemon",
]
