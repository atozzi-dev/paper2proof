# Runner image ML stack (A-06): the input of images/runner/requirements.lock, re-locked with
# hashes by scripts/lock_images.sh. Not an installable project. torch and torchvision come only
# from PyTorch's CUDA 12.6 index (driver >= 560; the PyPI wheels are CUDA 13, driver >= 580);
# everything else comes from PyPI.
[project]
name = "p2p-runner-stack"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy",
    "scipy",
    "scikit-learn",
    "transformers",
    "datasets",
    "timm",
    "accelerate",
    "evaluate",
    "pandas",
    "pyarrow>=14.0.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
