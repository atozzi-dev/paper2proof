# Invariant 4: Terraform creates SecretStash containers only; values come from deploy/secrets.sh.
metadata:
  id: "CKV_P2P_2"
  name: "SecretStash secrets are created without a version or payload"
  category: "SECRETS"
definition:
  and:
    - cond_type: "attribute"
      resource_types: ["nebius_mysterybox_v1_secret"]
      attribute: "secret_version"
      operator: "not_exists"
    - cond_type: "attribute"
      resource_types: ["nebius_mysterybox_v1_secret"]
      attribute: "sensitive"
      operator: "not_exists"
