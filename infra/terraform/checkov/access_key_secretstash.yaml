# Invariant 4: an S3 access key must hand its secret to SecretStash, never to the API response
# (which would put it in the Terraform state).
metadata:
  id: "CKV_P2P_1"
  name: "Nebius access keys deliver their secret to SecretStash (MYSTERY_BOX)"
  category: "SECRETS"
definition:
  cond_type: "attribute"
  resource_types: ["nebius_iam_v2_access_key"]
  attribute: "secret_delivery_mode"
  operator: "equals"
  value: "MYSTERY_BOX"
