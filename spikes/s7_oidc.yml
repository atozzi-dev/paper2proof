# Spike S7: GitHub Actions OIDC -> Nebius federated credentials -> access token, through the deploy
# job's own code (.github/scripts/nebius_token.py: the SDK's FederatedCredentialsBearer, subject =
# service account id, actor = the GitHub JWT). PASS on 2026-10-21 (docs/spikes/RESULTS.md).
# Inactive template. To run it (see spikes/README.md, S7): copy it to
# .github/workflows/spike-s7-oidc.yml on a branch named spike/oidc, push, read the job log,
# then tear everything down (branch AND federated credential). Repository variables (not secrets):
#   NEBIUS_SPIKE_SA_ID            id of a THROWAWAY service account with no roles (required)
#   NEBIUS_CLI_INSTALLER_SHA256   sha256 of https://artifacts.nebius.cloud/cli/install.sh,
#                                 computed by you beforehand (required)
#   NEBIUS_OIDC_AUDIENCE          audience to request from GitHub (default sts.nebius.com, the only
#                                 value the token service accepted)
# Tokens are masked and never printed. The last step prints `VERDICT: PASS|FAIL|PARTIAL`.
name: spike-s7-oidc

on:
  push:
    branches: [spike/oidc]
  workflow_dispatch:

permissions: {}

jobs:
  oidc:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    env:
      NEBIUS_AUTH_MODE: oidc
      NEBIUS_CI_SA_ID: ${{ vars.NEBIUS_SPIKE_SA_ID }}
      NEBIUS_OIDC_AUDIENCE: ${{ vars.NEBIUS_OIDC_AUDIENCE || 'sts.nebius.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Nebius CLI (checksum-pinned installer)
        env:
          INSTALLER_SHA256: ${{ vars.NEBIUS_CLI_INSTALLER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$INSTALLER_SHA256" || { echo "set NEBIUS_CLI_INSTALLER_SHA256"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/install.sh" https://artifacts.nebius.cloud/cli/install.sh
          echo "$INSTALLER_SHA256  $RUNNER_TEMP/install.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/install.sh"
          echo "$HOME/.nebius/bin" >> "$GITHUB_PATH"

      # Only the nebius SDK closure from uv.lock, as in deploy.yml.
      - name: Install the Nebius SDK (locked wheels)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary :all: --no-deps -r .github/deploy-requirements.txt

      # The script prints the non-secret claims it presents (sub, aud, ref, environment).
      - name: Exchange the GitHub token (deploy path)
        id: exchange
        run: |
          if "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/nebius_token.py \
              --out "$RUNNER_TEMP/nebius.token"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the token with the Nebius CLI
        id: whoami
        if: steps.exchange.outputs.ok == '1'
        run: |
          set -euo pipefail  # the if tests the CLI, not only jq
          if NEBIUS_IAM_TOKEN="$(cat "$RUNNER_TEMP/nebius.token")" nebius iam whoami --format json \
              | jq '{user: (.user_profile.id // null), service_account: (.service_account_profile.info.metadata.id // null)}'; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Verdict
        if: always()
        env:
          EXCHANGE: ${{ steps.exchange.outputs.ok }}
          WHOAMI: ${{ steps.whoami.outputs.ok }}
        run: |
          rm -f "$RUNNER_TEMP/nebius.token"
          if [ "$EXCHANGE" = 1 ] && [ "$WHOAMI" = 1 ]; then
            echo "VERDICT: PASS"
          elif [ "$EXCHANGE" = 1 ]; then
            echo "VERDICT: PARTIAL (token obtained, CLI whoami failed)"
          else
            echo "VERDICT: FAIL (see the exchange step)"
          fi
