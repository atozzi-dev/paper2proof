# Local dev stack (P2P_ENV=dev). SeaweedFS (Apache-2.0) provides the S3 API that stands in for
# Nebius Object Storage. S3 credentials come from .env (gitignored): RUNTIME_S3_KEY_ID /
# RUNTIME_S3_SECRET, the same variables the app uses in prod.
name: paper2proof-dev

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "p2p-dev",
        "credentials": [{"accessKey": "${RUNTIME_S3_KEY_ID:?set RUNTIME_S3_KEY_ID in .env}",
                         "secretKey": "${RUNTIME_S3_SECRET:?set RUNTIME_S3_SECRET in .env}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

services:
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data

volumes:
  s3-data:
